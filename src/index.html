<!doctype html>
<html lang="en">

<head>
  <!-- METADATOS Y TITULO -->
  <meta charset="utf-8">
  <title>PorfolioPersonal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- FUENTES EXTERNAS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>

<body>
  <!-- ELEMENTO DEL CURSOR PERSONALIZADO -->
  <div class="circle"></div>

  <!-- NODO RAIZ DE LA APLICACION -->
  <app-root></app-root>

  <!-- LOGICA DEL CURSOR ANIMADO -->
  <script>
    console.clear();

    const circleElement = document.querySelector('.circle');
    const mouse = { x: 0, y: 0 };
    const previousMouse = { x: 0, y: 0 }
    const circle = { x: 0, y: 0 };

    let currentScale = 0;
    let currentAngle = 0;

    /* SEGUIMIENTO DEL MOVIMIENTO DEL MOUSE */
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
    });

    const speed = 0.17;

    /* FUNCION DE ANIMACION POR FRAME */
    const tick = () => {
      // CALCULO DE POSICION CON SUAVIZADO
      circle.x += (mouse.x - circle.x) * speed;
      circle.y += (mouse.y - circle.y) * speed;
      const translateTransform = `translate(${circle.x}px, ${circle.y}px)`;

      // CALCULO DE VELOCIDAD Y ESCALA
      const deltaMouseX = mouse.x - previousMouse.x;
      const deltaMouseY = mouse.y - previousMouse.y;
      previousMouse.x = mouse.x;
      previousMouse.y = mouse.y;
      const mouseVelocity = Math.min(Math.sqrt(deltaMouseX ** 2 + deltaMouseY ** 2) * 4, 150);
      const scaleValue = (mouseVelocity / 150) * 0.5;
      currentScale += (scaleValue - currentScale) * speed;
      const scaleTransform = `scale(${1 + currentScale}, ${1 - currentScale})`;

      // CALCULO DE ANGULO DE ROTACION
      const angle = Math.atan2(deltaMouseY, deltaMouseX) * 180 / Math.PI;
      if (mouseVelocity > 20) {
        currentAngle = angle;
      }
      const rotateTransform = `rotate(${currentAngle}deg)`;

      // APLICACION DE TRANSFORMACIONES AL ELEMENTO
      circleElement.style.transform = `${translateTransform} ${rotateTransform} ${scaleTransform}`;

      window.requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>

</html>
